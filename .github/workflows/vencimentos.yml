name: Vencimentos

on:
  schedule:
    - cron: "17 12 * * *"   # todo dia ~09:17 (Brasilia)
  workflow_dispatch: {}      # rodar na mao manda a lista completa

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verificar vencimentos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python vencimentos.py
